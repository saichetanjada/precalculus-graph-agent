services:
  - type: web
    name: graph-studio
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: TUTOR_ACCESS_CODE
        generateValue: true
